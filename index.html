<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LuyệnĐề THPT</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      window.pdfjsLib = window.pdfjsLib || window["pdfjs-dist/build/pdf"];
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
    </script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [["$$", "$$"]],
        },
        svg: { fontCache: "global" },
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
    ></script>
  </head>
  <body data-layout="auto">
    <header class="app-header">
      <div class="header-left">
        <a href="#" id="logo-btn" class="logo">LuyệnĐề THPT</a>
      </div>
      <div class="header-right">
        <div class="layout-switcher" role="group" aria-label="Chế độ giao diện">
          <button
            type="button"
            id="layout-auto"
            class="layout-btn active"
            data-mode="auto"
          >
            Tự động
          </button>
          <button
            type="button"
            id="layout-mobile"
            class="layout-btn"
            data-mode="mobile"
          >
            Điện thoại
          </button>
          <button
            type="button"
            id="layout-desktop"
            class="layout-btn"
            data-mode="desktop"
          >
            Máy tính
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="home-view" class="view-section active">
        <div class="setup-container">
          <div class="upload-box">
            <div class="upload-actions" id="upload-actions">
              <label
                for="file-input"
                class="btn btn-outline"
                title="Tài liệu mới: thay các trang đang có"
              >
                📄 Chọn PDF hoặc Ảnh
                <input
                  type="file"
                  id="file-input"
                  accept="application/pdf,image/*"
                  multiple
                  hidden
                />
              </label>
              <input
                type="file"
                id="add-input"
                accept="application/pdf,image/*"
                multiple
                hidden
              />
              <label
                for="camera-input"
                class="btn btn-outline"
                title="Chụp thêm một trang vào tài liệu đang dùng"
              >
                📷 Chụp ảnh đề
                <input
                  type="file"
                  id="camera-input"
                  accept="image/*"
                  capture="environment"
                  hidden
                />
              </label>
            </div>
            <p id="upload-hint" class="upload-hint"></p>
            <div class="paste-box">
              <label for="text-input" class="field-label"
                >Hoặc dán nội dung văn bản đề / bài tập:</label
              >
              <textarea
                id="text-input"
                class="text-input"
                rows="5"
                placeholder="Dán câu hỏi, đoạn văn bản hoặc đề cương vào đây..."
              ></textarea>
            </div>
          </div>

          <div class="config-box">
            <div class="config-grid">
              <div class="config-item">
                <label for="subject-select" class="field-label">Môn học</label>
                <select id="subject-select" class="select-input">
                  <option value="toan">Toán học</option>
                  <option value="ly">Vật lí</option>
                  <option value="hoa">Hóa học</option>
                  <option value="sinh">Sinh học</option>
                  <option value="su">Lịch sử</option>
                  <option value="dia">Địa lí</option>
                  <option value="gdktpl">GD Kinh tế & Pháp luật</option>
                  <option value="anh">Tiếng Anh</option>
                  <option value="tin">Tin học</option>
                  <option value="congnghe">Công nghệ</option>
                </select>
              </div>

              <div class="config-item">
                <span class="field-label">Chế độ xử lý</span>
                <div class="radio-group" id="mode-group">
                  <label class="radio-card">
                    <input
                      type="radio"
                      name="process-mode"
                      value="extract"
                      checked
                    />
                    <span>Tách đề có sẵn</span>
                  </label>
                  <label class="radio-card">
                    <input type="radio" name="process-mode" value="generate" />
                    <span>Tạo đề mới</span>
                  </label>
                </div>
              </div>

              <div class="config-item">
                <span class="field-label">Kiểu làm bài</span>
                <div class="radio-group" id="play-group">
                  <label class="radio-card">
                    <input
                      type="radio"
                      name="play-mode"
                      value="quick"
                      checked
                    />
                    <span
                      >Luyện tập nhanh
                      <small>AI hỗ trợ, giải ngay khi chọn đáp án</small></span
                    >
                  </label>
                  <label class="radio-card">
                    <input type="radio" name="play-mode" value="mock" />
                    <span
                      >Thi thử THPT
                      <small
                        >Có giờ, không AI, nộp bài mới có điểm và lời
                        giải</small
                      ></span
                    >
                  </label>
                  <label class="radio-card">
                    <input type="radio" name="play-mode" value="game" />
                    <span
                      >Trò chơi
                      <small
                        >Mỗi câu giới hạn thời gian, lập kỷ lục</small
                      ></span
                    >
                  </label>
                </div>
              </div>

              <div class="config-item hidden" id="mock-time-item">
                <label for="mock-time" class="field-label"
                  >Thời gian làm bài</label
                >
                <select id="mock-time" class="select-input">
                  <option value="45">45 phút</option>
                  <option value="60" selected>60 phút</option>
                  <option value="90">90 phút</option>
                  <option value="0">Không giới hạn</option>
                </select>
              </div>

              <div class="config-item hidden" id="gen-structure-item">
                <span class="field-label">Cấu trúc đề khi AI tạo mới</span>
                <div class="radio-group" id="format-group">
                  <label class="radio-card">
                    <input
                      type="radio"
                      name="exam-format"
                      value="thpt"
                      checked
                    />
                    <span>Đủ 3 phần (THPT)</span>
                  </label>
                  <label class="radio-card">
                    <input type="radio" name="exam-format" value="short-mcq" />
                    <span>Chỉ trắc nghiệm</span>
                  </label>
                </div>
                <div id="short-count-wrap" class="hidden">
                  <label for="short-count" class="field-label"
                    >Số câu trắc nghiệm</label
                  >
                  <input
                    type="number"
                    id="short-count"
                    class="select-input"
                    min="1"
                    max="60"
                    value="10"
                  />
                </div>
              </div>
            </div>

            <div class="action-bar">
              <button
                type="button"
                id="create-exam-btn"
                class="btn btn-primary"
              >
                Tạo đề
              </button>
            </div>
          </div>
        </div>

        <section id="page-grid-section" class="page-grid-section hidden">
          <div class="page-grid-header">
            <h2 class="section-title">Chọn các trang cần xử lý</h2>
            <div class="page-grid-controls">
              <button type="button" id="grid-add-btn" class="btn btn-sm">
                ➕ Thêm file
              </button>
              <button type="button" id="grid-camera-btn" class="btn btn-sm">
                📷 Chụp thêm
              </button>
              <button
                type="button"
                id="select-all-pages-btn"
                class="btn btn-sm"
              >
                Chọn tất cả
              </button>
              <button
                type="button"
                id="deselect-all-pages-btn"
                class="btn btn-sm"
              >
                Bỏ chọn
              </button>
              <button
                type="button"
                id="clear-files-btn"
                class="btn btn-sm btn-danger"
              >
                Xóa tài liệu
              </button>
            </div>
          </div>
          <div id="page-grid" class="page-grid"></div>
        </section>
      </section>

      <section id="exam-view" class="view-section hidden">
        <div class="exam-topbar" id="exam-topbar">
          <div class="exam-nav-info">
            <button type="button" id="back-home-btn" class="btn btn-sm">
              ← Trang chủ
            </button>
            <span id="exam-title" class="exam-title">Đề luyện tập</span>
            <span id="save-status" class="save-status">Đã lưu tự động</span>
            <span id="exam-mode-badge" class="mode-badge">Luyện tập nhanh</span>
          </div>
          <div class="nav-strip" id="nav-strip">
            <button
              type="button"
              id="nav-toggle-btn"
              class="nav-toggle"
              aria-expanded="false"
              aria-controls="question-nav-bar"
              title="Mở / thu gọn danh sách câu hỏi"
            >
              <span class="nav-toggle-icon" aria-hidden="true">▦</span>
              <span>Câu <b id="nav-pos">1/1</b></span>
              <span class="nav-toggle-chev" aria-hidden="true">▾</span>
            </button>
            <span id="exam-timer" class="exam-timer hidden"></span>
            <div
              id="question-nav-bar"
              class="question-nav-bar"
              aria-label="Danh sách câu hỏi"
            ></div>
            <div class="exam-topbar-actions">
              <button
                type="button"
                id="share-exam-btn"
                class="btn btn-sm btn-outline"
              >
                Chia sẻ đề
              </button>
              <button
                type="button"
                id="submit-exam-btn"
                class="btn btn-sm btn-primary"
              >
                Nộp bài
              </button>
            </div>
          </div>
        </div>

        <div id="exam-workspace" class="exam-workspace">
          <div id="left-pane" class="pane left-pane">
            <div class="question-header">
              <span id="question-part-badge" class="part-badge">Phần I</span>
              <span id="question-number-label" class="question-number"
                >Câu 1</span
              >
            </div>
            <div id="game-bar" class="game-bar hidden">
              <div class="game-row">
                <span id="game-q-time" class="game-time">1:00</span>
                <span id="game-diff" class="game-diff">Dễ</span>
                <span id="game-streak" class="game-streak"></span>
                <span id="game-score" class="game-score">⭐ 0</span>
              </div>
              <div class="game-progress">
                <div id="game-progress-fill" class="game-fill"></div>
              </div>
              <div id="game-feedback" class="game-feedback"></div>
            </div>
            <div id="question-content" class="question-content"></div>
            <div
              id="question-image-container"
              class="question-image-container hidden"
            >
              <img
                id="question-image"
                class="question-image"
                alt="Hình minh họa câu hỏi"
              />
            </div>
            <div id="answer-mcq" class="answer-area hidden"></div>
            <div id="answer-tf" class="answer-area hidden"></div>
            <div id="answer-short" class="answer-area hidden">
              <label for="short-answer-input" class="field-label"
                >Nhập đáp án của bạn:</label
              >
              <input
                type="text"
                id="short-answer-input"
                class="short-answer-input"
                placeholder="Ví dụ: 12,5 hoặc -4"
              />
            </div>
            <div class="question-footer-nav">
              <button
                type="button"
                id="prev-question-btn"
                class="btn btn-secondary"
              >
                Câu trước
              </button>
              <button
                type="button"
                id="next-question-btn"
                class="btn btn-secondary"
              >
                Câu tiếp
              </button>
            </div>
          </div>

          <div id="right-pane" class="pane right-pane">
            <div id="summary-panel" class="summary-panel hidden"></div>
            <div id="score-panel" class="score-panel hidden">
              <div class="score-summary">
                <span class="score-label">Tổng điểm:</span>
                <strong id="total-score" class="total-score">0.00 / 10</strong>
              </div>
              <div
                id="question-result-status"
                class="question-result-status"
              ></div>
            </div>

            <div id="explanation-panel" class="explanation-panel">
              <div class="explanation-tabs" role="tablist">
                <button
                  type="button"
                  id="tab-quick"
                  class="tab-btn active"
                  role="tab"
                  aria-selected="true"
                  data-tab="quick"
                >
                  Giải nhanh
                </button>
                <button
                  type="button"
                  id="tab-essay"
                  class="tab-btn"
                  role="tab"
                  aria-selected="false"
                  data-tab="essay"
                >
                  Chi tiết từng bước
                </button>
                <button
                  type="button"
                  id="explain-current-btn"
                  class="btn btn-sm btn-outline"
                >
                  Giải chi tiết từng bước
                </button>
              </div>
              <div id="explanation-body" class="explanation-body">
                <div id="content-quick" class="tab-content active">
                  <div id="quick-warning" class="quick-warning hidden"></div>
                  <div id="quick-detail" class="quick-detail"></div>
                </div>
                <div id="content-essay" class="tab-content hidden"></div>
              </div>
            </div>

            <div id="chat-panel" class="chat-panel">
              <div
                class="chat-header"
                id="chat-header"
                role="button"
                tabindex="0"
                aria-expanded="true"
              >
                <span>Hỏi thêm gia sư AI về câu này</span>
                <span class="chat-chev" aria-hidden="true">▾</span>
              </div>
              <div id="chat-messages" class="chat-messages"></div>
              <form id="chat-form" class="chat-form">
                <input
                  type="text"
                  id="chat-input"
                  class="chat-input"
                  placeholder="Hỏi cách biến đổi, bấm máy hoặc chỗ chưa hiểu..."
                  autocomplete="off"
                />
                <button
                  type="submit"
                  id="chat-send-btn"
                  class="btn btn-primary btn-sm"
                >
                  Gửi
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <section id="recent-section" class="recent-section hidden">
        <h2 class="section-title">Bài gần đây</h2>
        <div id="recent-list" class="recent-list"></div>
      </section>
    </main>

    <div id="loading-overlay" class="loading-overlay hidden" aria-live="polite">
      <div class="loading-box">
        <div class="spinner"></div>
        <p id="loading-text" class="loading-text">Đang xử lý...</p>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
