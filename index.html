<div class="config-box">
      <div class="config-grid">
        <div class="config-item">
          <label for="subject-select" class="field-label">Môn học</label>
          <select id="subject-select" class="select-input">
            <option value="toan">Toán học</option>
            <option value="ly">Vật lí</option>
            <option value="hoa">Hóa học</option>
            <option value="sinh">Sinh học</option>
            <option value="su">Lịch sử</option>
            <option value="dia">Địa lí</option>
            <option value="gdktpl">GD Kinh tế & Pháp luật</option>
            <option value="anh">Tiếng Anh</option>
            <option value="tin">Tin học</option>
            <option value="congnghe">Công nghệ</option>
          </select>
        </div>

        <div class="config-item">
          <span class="field-label">Chế độ xử lý</span>
          <div class="radio-group" id="mode-group">
            <label class="radio-card">
              <input type="radio" name="process-mode" value="extract" checked>
              <span>Tách đề có sẵn</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="process-mode" value="generate">
              <span>Tạo đề mới</span>
            </label>
          </div>
        </div>

        <div class="config-item">
          <span class="field-label">Cấu trúc đề</span>
          <div class="radio-group" id="format-group">
            <label class="radio-card">
              <input type="radio" name="exam-format" value="thpt" checked>
              <span>Dạng đề THPT (3 phần)</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="exam-format" value="short-mcq">
              <span>Trắc nghiệm ngắn</span>
            </label>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <button type="button" id="create-exam-btn" class="btn btn-primary">Tạo đề</button>
      </div>
    </div>
  </div>

  <!-- Khu vực lưới ảnh trang đã tách từ PDF / Ảnh chụp -->
  <section id="page-grid-section" class="page-grid-section hidden">
    <div class="page-grid-header">
      <h2 class="section-title">Chọn các trang cần xử lý</h2>
      <div class="page-grid-controls">
        <button type="button" id="select-all-pages-btn" class="btn btn-sm">Chọn tất cả</button>
        <button type="button" id="deselect-all-pages-btn" class="btn btn-sm">Bỏ chọn</button>
        <button type="button" id="clear-files-btn" class="btn btn-sm btn-danger">Xóa tài liệu</button>
      </div>
    </div>
    <div id="page-grid" class="page-grid"></div>
  </section>
</section>

<!-- Khu vực Làm bài & Chữa bài -->
<section id="exam-view" class="view-section hidden">
  <div class="exam-topbar">
    <div class="exam-nav-info">
      <button type="button" id="back-home-btn" class="btn btn-sm">← Trang chủ</button>
      <span id="exam-title" class="exam-title">Đề luyện tập</span>
      <span id="save-status" class="save-status">Đã lưu tự động</span>
    </div>
    <div id="question-nav-bar" class="question-nav-bar" aria-label="Danh sách câu hỏi"></div>
    <div class="exam-topbar-actions">
      <button type="button" id="share-exam-btn" class="btn btn-sm btn-outline">Chia sẻ đề</button>
      <button type="button" id="submit-exam-btn" class="btn btn-sm btn-primary">Nộp bài</button>
    </div>
  </div>

  <div id="exam-workspace" class="exam-workspace">
    <!-- Ngăn trái: Đề bài, hình minh họa & chọn đáp án -->
    <div id="left-pane" class="pane left-pane">
      <div class="question-header">
        <span id="question-part-badge" class="part-badge">Phần I</span>
        <span id="question-number-label" class="question-number">Câu 1</span>
      </div>

      <div id="question-content" class="question-content"></div>

      <div id="question-image-container" class="question-image-container hidden">
        <img id="question-image" class="question-image" alt="Hình minh họa câu hỏi">
      </div>

      <!-- Khu vực trả lời cho Phần I: Trắc nghiệm A-D -->
      <div id="answer-mcq" class="answer-area hidden"></div>

      <!-- Khu vực trả lời cho Phần II: Đúng/Sai 4 ý a-d -->
      <div id="answer-tf" class="answer-area hidden"></div>

      <!-- Khu vực trả lời cho Phần III: Trả lời ngắn -->
      <div id="answer-short" class="answer-area hidden">
        <label for="short-answer-input" class="field-label">Nhập đáp án của bạn:</label>
        <input type="text" id="short-answer-input" class="short-answer-input" placeholder="Ví dụ: 12,5 hoặc -4">
      </div>

      <div class="question-footer-nav">
        <button type="button" id="prev-question-btn" class="btn btn-secondary">Câu trước</button>
        <button type="button" id="next-question-btn" class="btn btn-secondary">Câu tiếp</button>
      </div>
    </div>

    <!-- Ngăn phải: Kết quả chấm, lời giải 2 tab & khung chat AI -->
    <div id="right-pane" class="pane right-pane">
      <div id="score-panel" class="score-panel hidden">
        <div class="score-summary">
          <span class="score-label">Tổng điểm:</span>
          <strong id="total-score" class="total-score">0.00 / 10</strong>
        </div>
        <div id="question-result-status" class="question-result-status"></div>
      </div>

      <div id="explanation-panel" class="explanation-panel">
        <div class="explanation-tabs" role="tablist">
          <button type="button" id="tab-essay" class="tab-btn active" role="tab" aria-selected="true" data-tab="essay">Tự luận</button>
          <button type="button" id="tab-quick" class="tab-btn" role="tab" aria-selected="false" data-tab="quick">Trắc nghiệm nhanh</button>
          <button type="button" id="explain-current-btn" class="btn btn-sm btn-outline">Xem lời giải câu này</button>
        </div>

        <div id="explanation-body" class="explanation-body">
          <div id="content-essay" class="tab-content active"></div>
          <div id="content-quick" class="tab-content hidden">
            <div id="quick-warning" class="quick-warning hidden"></div>
            <div id="quick-detail" class="quick-detail"></div>
          </div>
        </div>
      </div>

      <div id="chat-panel" class="chat-panel">
        <div class="chat-header">
          <span>Hỏi thêm gia sư AI về câu này</span>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <input type="text" id="chat-input" class="chat-input" placeholder="Hỏi cách biến đổi, bấm máy hoặc chỗ chưa hiểu..." autocomplete="off">
          <button type="submit" id="chat-send-btn" class="btn btn-primary btn-sm">Gửi</button>
        </form>
      </div>
    </div>
  </div>
</section>

<section id="recent-section" class="recent-section hidden">
  <h2 class="section-title">Bài gần đây</h2>
  <div id="recent-list" class="recent-list"></div>
</section>
